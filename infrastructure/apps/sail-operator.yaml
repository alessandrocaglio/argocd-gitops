apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sail-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2" # Runs after OLM is ready
spec:
  project: default
  source:
    repoURL: 'https://github.com/alessandrocaglio/argocd-gitops.git'
    path: infrastructure/operators/sail/overlays/kind
    targetRevision: HEAD
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: sail-operator
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]