apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
  # Pulls the stable core manifests directly from GitHub
  - https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
  #- ingress.yaml

labels:
  - includeSelectors: true
    pairs:
      managed-by: bootstrap-task
      env: dev-lab